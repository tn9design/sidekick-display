<g class="layer peach"><svg x="-84" y="-47" width="1839" height="1035" viewBox="0 0 1672 941" preserveAspectRatio="none" overflow="visible"><path fill="#e9a087" d="M1170-200C1080 80 1110 310 1260 458S1390 710 1470 841S1630 995 1870 1020V-200Z"/></svg></g>
<g class="layer brown"><svg x="-84" y="-47" width="1839" height="1035" viewBox="0 0 1672 941" preserveAspectRatio="none" overflow="visible"><path fill="#705a5d" d="M565-200H1140C1160 40 986 92 835 125S612 92 565-200Z"/></svg></g>
<g class="layer charcoal"><svg x="-84" y="-47" width="1839" height="1035" viewBox="0 0 1672 941" preserveAspectRatio="none" overflow="visible"><path fill="#424246" d="M1190 1100C1205 912 1328 808 1410 844S1550 1040 1560 1100Z"/></svg></g>
<defs><filter id="grain"><feTurbulence type="fractalNoise" baseFrequency=".7" numOctaves="3" stitchTiles="stitch"/></filter></defs><rect width="1672" height="941" filter="url(#grain)" opacity=".14" style="mix-blend-mode:multiply"/></svg>
