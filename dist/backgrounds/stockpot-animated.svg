<svg xmlns="http://www.w3.org/2000/svg" width="1672" height="941" viewBox="0 0 1672 941">
<title>Stockpot (Animated)</title>
<style>.layer{animation:drift var(--duration) ease-in-out infinite alternate;transform-origin:836px 470px}.blue{--duration:10.5s;--x:18px;--y:110px;--r:1deg;transform-origin:0px 470px}.peach{--duration:13.25s;--x:-74px;--y:10px;--r:-4deg;transform-origin:1672px 282px}.brown{--duration:15.25s;--x:74px;--y:31px;--r:5deg}.charcoal{--duration:11.75s;--x:-55px;--y:-31px;--r:-4deg}@keyframes drift{from{transform:translate(0,0) rotate(0deg) scale(1)}to{transform:translate(var(--x),var(--y)) rotate(var(--r)) scale(1.055)}}@media(prefers-reduced-motion:reduce){.layer{animation:none}}</style>
<rect width="1672" height="941" fill="#edc9c1"/>
