<!doctype html><html lang="en"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Sidekick Stage 2 isolated checks</title><style>body{margin:0;background:#ddd;font:16px system-ui}header{padding:8px;background:white}#results{white-space:pre-wrap;padding:8px}sidekick-display{width:788px}button{padding:8px}</style><header><button id="run">Run isolated checks</button><button id="performance">Compare Glass frames</button> Controlled data only; no HA connection.</header><sidekick-display></sidekick-display><pre id="results">Ready</pre><script type="module">
import {normalizeConfig} from '../dist/sidekick-display.js';
const card=document.querySelector('sidekick-display'),output=document.querySelector('#results');let mounts=0,unmounts=0;
class TestChild extends HTMLElement{constructor(){super();this.attachShadow({mode:'open'});}set hass(h){this._hass=h;if(this.explicitTheme&&h.themes.themes?.[this.explicitTheme])this.style.setProperty('--ha-card-background',h.themes.themes[this.explicitTheme]['ha-card-background']);this.shadowRoot.innerHTML='<article style="padding:24px;background:var(--ha-card-background);color:var(--primary-text-color)">Test embedded card</article>';}get hass(){return this._hass;}connectedCallback(){mounts++;}disconnectedCallback(){unmounts++;}}
customElements.define('test-child',TestChild);window.loadCardHelpers=async()=>({createCardElement:config=>{const child=document.createElement('test-child');if(config.explicit_color)child.style.setProperty('--ha-card-background',config.explicit_color);child.explicitTheme=config.theme;return child;}});
const hass={connected:true,locale:{language:'en',time_format:'12'},config:{time_zone:'America/Chicago'},themes:{darkMode:false,themes:{'fixture-theme':{'ha-card-background':'#224466'}}},states:{'sun.sun':{state:'above_horizon'},'input_boolean.night':{state:'off'},'weather.test':{state:'sunny',attributes:{temperature:88,temperature_unit:'°F'}}}};
const base={type:'custom:sidekick-display',weather:{entity:'weather.test'},sidebar:{enabled:true,buttons:[{id:'test',name:'Test',icon:'mdi:information-outline',card:{type:'markdown'}}]}};card.setConfig(base);card.hass=hass;
const tick=()=>new Promise(resolve=>setTimeout(resolve,30));const root=()=>card.shadowRoot;
const wait=async p=>{for(let i=0;i<100;i++){if(p())return;await new Promise(r=>setTimeout(r,20));}throw Error('Runtime result timed out');};
const set=async(c,h=hass)=>{card.setConfig({...base,...c});card.hass=h;await tick();};
const check=(n,c)=>{if(!c)throw Error(n);output.textContent+='PASS '+n+'\n';};
document.querySelector('#run').onclick=async()=>{output.textContent='';try{
await set({});await wait(()=>!root().querySelector('.background').hidden);check('Default day/HA appearance',root().querySelector('.shell').dataset.mode==='day'&&root().querySelector('.shell').dataset.appearance==='light');const priorSize=card._size;let sizeCalls=0;card._size=function(){sizeCalls++;return priorSize.call(this);};for(let i=0;i<10;i++)card._clock();check('Unchanged clock avoids repeated sizing',sizeCalls===0);card._size=priorSize;check('Weather reading/unit',root().querySelector('.weather span').textContent==='88 °F');
card.hass={...hass,states:{...hass.states,'weather.test':{state:'unavailable',attributes:{temperature:88,temperature_unit:'°F'}}}};await tick();check('Unavailable weather hidden',root().querySelector('.weather').hidden&&card.getDiagnostics().some(x=>x.includes('weather')));
card.hass=hass;await tick();check('Weather recovery',!root().querySelector('.weather').hidden);card.hass={...hass,connected:false};await tick();check('Disconnected weather hidden',root().querySelector('.weather').hidden);
await set({day_night:{mode:'entity',entity:'input_boolean.night'}});card.hass={...hass,states:{...hass.states,'input_boolean.night':{state:'on'}}};await tick();check('Entity on night',root().querySelector('.shell').dataset.mode==='night');card.hass={...hass,states:{'sun.sun':{state:'unavailable'}}};await tick();check('Missing sources retain night',root().querySelector('.shell').dataset.mode==='night');card.hass=hass;await tick();check('Configured entity recovery',root().querySelector('.shell').dataset.mode==='day');
await set({day_night:{mode:'night'},appearance:{mode:'light'}});check('Independent night/light',root().querySelector('.shell').dataset.appearance==='light'&&root().querySelector('.dim').style.opacity==='0.5');root().querySelectorAll('button')[1].click();await wait(()=>!!card._child);const child=card._child,count=mounts;card.hass={...hass,states:{...hass.states,'sun.sun':{state:'below_horizon'}}};await tick();check('Hass update preserves active child',card._child===child&&mounts===count);check('Dimming covers child',Number(getComputedStyle(root().querySelector('.dim')).zIndex)>0&&root().querySelector('.dim').style.opacity==='0.5');root().querySelector('button').click();await tick();check('Home releases child',!card._child&&unmounts>0);
for(const mode of ['dark','light']){await set({appearance:{mode},sidebar:{...base.sidebar,buttons:[{...base.sidebar.buttons[0],card:{type:'markdown',explicit_color:'#aa3344'}}]}});root().querySelectorAll('button')[1].click();await wait(()=>!!card._child);check('Explicit child color preserved in '+mode,getComputedStyle(card._child.shadowRoot.querySelector('article')).backgroundColor==='rgb(170, 51, 68)');check('Child receives '+mode+' preference',card._child.hass.themes.darkMode===(mode==='dark'));}
await set({});const retainedNav=root().querySelector('nav'),retainedBackground=root().querySelector('.background');root().querySelectorAll('button')[1].click();await wait(()=>!!card._child);check('Navigation preserves nav and background',root().querySelector('nav')===retainedNav&&root().querySelector('.background')===retainedBackground);check('Marker targets selected button',root().querySelector('.selection').style.transform==='translateY(56px)'&&root().querySelectorAll('button')[1].getAttribute('aria-current')==='page');root().querySelector('button').click();check('Marker returns Home',root().querySelector('.selection').style.transform==='translateY(0px)'&&!card._child);root().querySelectorAll('button')[1].click();root().querySelector('button').click();await tick();check('Rapid navigation cancels stale child mount',!card._child&&!!root().querySelector('.home'));await set({sidebar:{...base.sidebar,buttons:Array.from({length:4},(_,i)=>({...base.sidebar.buttons[0],id:'page'+i,name:'Page '+i}))}});root().querySelectorAll('button')[4].click();await wait(()=>!!card._child);check('Five-button marker reaches last item',root().querySelector('.selection').style.transform==='translateY(224px)');root().querySelector('button').click();await tick();check('Five-button marker returns Home',root().querySelector('.selection').style.transform==='translateY(0px)');

for(const mode of ['dark','light']){await set({appearance:{mode},sidebar:{...base.sidebar,buttons:[{...base.sidebar.buttons[0],card:{type:'markdown',theme:'fixture-theme'}}]}});root().querySelectorAll('button')[1].click();await wait(()=>!!card._child);check('Explicit child theme preserved in '+mode,card._child.explicitTheme==='fixture-theme'&&getComputedStyle(card._child.shadowRoot.querySelector('article')).backgroundColor==='rgb(34, 68, 102)');}
for(const mode of ['dark','light']){await set({appearance:{mode},sidebar:{...base.sidebar,color:'#123456',icon_color:'#fedcba',accent:'#abcdef'}});check('Manual colors preserved in '+mode,root().querySelector('.shell').style.getPropertyValue('--sidekick-strip')==='#123456'&&root().querySelector('.shell').style.getPropertyValue('--sidekick-accent')==='#abcdef');}
await set({sidebar:{...base.sidebar,style:'glass',blur:false}});check('Glass no-blur fallback',root().querySelector('nav').classList.contains('glass')&&!root().querySelector('nav').classList.contains('blur'));
await set({background:{night:'/missing-night.svg',day:'../dist/background.svg'},day_night:{mode:'night'}});await wait(()=>!root().querySelector('.background').hidden);check('Failed night uses configured day',root().querySelector('.background').getAttribute('src')==='../dist/background.svg');await set({background:{day:'../dist/background.svg'},day_night:{mode:'night'}});await wait(()=>!root().querySelector('.background').hidden);check('Empty night reuses configured day',root().querySelector('.background').getAttribute('src')==='../dist/background.svg');
await set({background:{night:'/missing-night.svg',day:'/missing-day.svg',fit:'fit',position_x:0,position_y:100},day_night:{mode:'night'}});await wait(()=>!root().querySelector('.background').hidden);check('Night/day failure bundled fallback',root().querySelector('.background').src.includes('background.svg')&&card.getDiagnostics().some(x=>x.includes('fallback')));check('Fit and positions',root().querySelector('.background').style.objectFit==='contain'&&root().querySelector('.background').style.objectPosition==='0% 100%');
for(const font of ['system','rounded','monospace'])for(const date_format of ['long','short','mdy','dmy'])for(const scale of [75,150]){await set({clock:{font,date_format,scale}});const home=root().querySelector('.home').getBoundingClientRect();check(font+'/'+date_format+'/'+scale+' fit',['.time','.date','.weather'].every(sel=>{const rect=root().querySelector(sel).getBoundingClientRect();return rect.left>=home.left+15&&rect.right<=home.right-15&&rect.top>=home.top+15&&rect.bottom<=home.bottom-15;}));}
await set({clock:{show_date:false,format:'24'}});check('Date hidden/24-hour',root().querySelector('.date').hidden&&root().querySelector('.period').textContent==='');check('Timezone validation',(()=>{try{normalizeConfig({clock:{timezone:'Invalid/Zone'}});return false;}catch{return true;}})());await set({day_night:{mode:'day'},appearance:{mode:'dark'}});output.textContent+='ALL ISOLATED CHECKS PASSED\n';
}catch(e){output.textContent+='FAIL '+e.message+'\n';}};
document.querySelector('#performance').onclick=async()=>{output.textContent='Controlled Glass navigation frame intervals (not real HA child workload)\n';try{for(const blur of [false,true,true,false]){await set({sidebar:{...base.sidebar,style:'glass',blur},day_night:{mode:'day'},appearance:{mode:'dark'}});await wait(()=>!root().querySelector('.background').hidden);const intervals=[];let previous;for(let i=0;i<120;i++){if(i%20===0)root().querySelectorAll('button')[i%40===0?1:0].click();const stamp=await new Promise(requestAnimationFrame);if(previous!==undefined)intervals.push(stamp-previous);previous=stamp;}const sorted=[...intervals].sort((a,b)=>a-b);output.textContent+=JSON.stringify({blur,samples:intervals.length,median_ms:sorted[Math.floor(sorted.length*.5)],p95_ms:sorted[Math.floor(sorted.length*.95)],over_33ms:intervals.filter(n=>n>33.4).length,max_ms:Math.max(...intervals)})+'\n';}await set({day_night:{mode:'day'},appearance:{mode:'dark'}});output.textContent+='COMPARISON COMPLETE\n';}catch(e){output.textContent+='FAIL '+e.message;}};
</script></html>
