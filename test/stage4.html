<!doctype html><html lang="en"><meta charset="utf-8"><title>Stage 4 notification stack checks</title><style>body{margin:0;font:16px system-ui}sidekick-display{display:block;width:788px}pre{white-space:pre-wrap}</style><sidekick-display></sidekick-display><pre id="results">Running</pre><script type="module">

await pause(180);check('Full underlying idle timer restarts after close',card._page==='home');
emit('eligible-after-close');await pause(30);check('Same ID is eligible immediately after close',top().page.id==='notice');
const old=card._temporary;card._dismissTemporary();emit('during-exit');await pause(310);check('Arrival during exit opens a fresh modal and survives stale close callback',card._temporary&&card._temporary!==old&&!card._temporary.closing);await close();
await set({...base,automation:{...base.automation,ignore_repeated_alerts:false}});await baseline();emit('off-first');await pause(30);const offEntry=top(),offDeadline=card._temporary.deadline;emit('off-repeat');check('Suppression off extends without duplicating or moving',top()===offEntry&&card._temporary.pages.length===1&&card._temporary.deadline>offDeadline);await close();
await set({...base,sidebar:{enabled:false}});await baseline();emit('sidebar-off');await pause(30);check('Sidebar-off modal still opens',!card.shadowRoot.querySelector('nav')&&!!card._temporary);await pause(5350);check('Real five-second timeout closes the entire stack',!card._temporary&&card._page==='home');
fail=true;emit('error');await pause(30);check('Creation failure stays in bounded notification error',!!card.shadowRoot.querySelector('.notification-card .error')&&!!card._temporary);await close();fail='async';emit('async-error');await pause(30);check('Rejected child render releases failed card',!!card.shadowRoot.querySelector('.error')&&!top().child);await close();fail=false;
let releaseDelay;delay=new Promise(r=>releaseDelay=r);emit('slow');await close();releaseDelay();delay=undefined;await pause(30);check('Closing during helper load prevents hidden mounts',!card._temporary&&!card.shadowRoot.querySelector('stage4-child'));

connection.connected=true;listeners.get('ready')();await pause(20);emit('during-reconnect');await baseline('offline');emit('offline');emit('during-reconnect');check('Reconnect baseline never replays',!card._temporary);emit('after-reconnect');await pause(30);check('Fresh post-reconnect notification received',!!card._temporary);
const reconnectDeadline=card._temporary.deadline;card.hass={...hass,connected:false};check('Disconnect releases notification children without extending timeout',!top().child&&card._temporary.deadline===reconnectDeadline);card.hass=hass;await baseline('after-offline');await pause(30);check('Reconnect remounts visible notification with original timer',!!top().child&&card._temporary.deadline===reconnectDeadline);await close();
history.replaceState(null,'','?clock_display=other');await set();check('Mismatched URL disables reception',!card._receptionConnection);history.replaceState(null,'',location.pathname);await set();check('Ordinary URL disables reception',!card._receptionConnection);
history.replaceState(null,'','?clock_display=office');await set();await baseline();emit('wrong','notice','input_text.other');check('Wrong helper cannot interrupt',!card._temporary);
await set({...base,appearance:{mode:'dark'},day_night:{mode:'night',dimming:50},card_style:{corner_radius:18,background:'#123456'}});await baseline();card._navigate('controls');await pause(30);emit('theme');await pause(30);check('Navigation and notification share radius and fill',card._child.style.getPropertyValue('--ha-card-border-radius')==='18px'&&top().child.style.getPropertyValue('--ha-card-background')==='#123456');check('Notification uses shared HA theme and dim layer above modal',top().child.latest.themes.darkMode&&card.shadowRoot.querySelector('.dim').style.opacity==='0.5'&&+getComputedStyle(card.shadowRoot.querySelector('.dim')).zIndex>+getComputedStyle(card._temporary.overlay).zIndex);
await set({...base,automation:{...base.automation,pages:[{...page,card:{type:'picture-entity',camera_view:'live',entity:'camera.test'}}]}});await baseline();emit('camera');await pause(30);check('Camera has rounded backing but transparent square child',top().element.classList.contains('camera')&&top().child.style.getPropertyValue('--ha-card-background')==='transparent'&&top().child.style.getPropertyValue('--ha-card-border-radius')==='0px');
await set({...base,automation:{...base.automation,pages:Array.from({length:13},(_,i)=>({...page,id:'page'+i}))}});await baseline();for(let i=0;i<12;i++)emit('overflow-'+i,'page'+i);await pause(50);check('Cards extend beyond bottom edge and modal page scrolls',card._temporary.overlay.scrollHeight>card._temporary.overlay.clientHeight&&card._temporary.stack.getBoundingClientRect().bottom>card.shadowRoot.querySelector('.shell').getBoundingClientRect().bottom);card._temporary.overlay.scrollTop=100;const scroll=card._temporary.overlay.scrollTop;emit('repeat-scrolled','page0');check('Visible repeat leaves scroll position unchanged',card._temporary.overlay.scrollTop===scroll);emit('new-scrolled','page12');await pause(40);check('New distinct notification returns modal page to top',card._temporary.overlay.scrollTop===0);await close();
const editor=document.createElement('sidekick-display-editor');document.body.append(editor);editor.setConfig({...base,custom_option:'preserved'});editor.hass=hass;const repeat=editor.shadowRoot.querySelector('input[type=checkbox]');let changed;editor.addEventListener('config-changed',e=>changed=e.detail.config);repeat.click();check('Global repeat toggle defaults on and preserves unrelated config',changed.automation.ignore_repeated_alerts===false&&changed.custom_option==='preserved');editor.remove();

</script></html>
